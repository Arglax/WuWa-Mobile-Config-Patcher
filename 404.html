<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found — WuWa Config Patcher</title>
    <link rel="stylesheet" href="css/style.css?v=1.6.0">
    <style>
        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: calc(100vh - 70px);
            text-align: center;
            padding: 20px;
        }
        .error-code {
            font-size: 120px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 20px;
        }
        .error-msg {
            font-size: 20px;
            color: var(--text-muted);
            margin-bottom: 30px;
        }
        .home-btn {
            background-color: var(--bg-surface);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.2s ease;
        }
        .home-btn:hover {
            background-color: rgba(45, 212, 191, 0.15);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="header-brand">
            <div class="logo-icon">⚡</div>
            <div>
                <h1>WuWa Config Patcher</h1>
            </div>
        </div>
    </header>

    <div class="error-container">
        <div class="error-code">404</div>
        <div class="error-msg">The configuration page you are looking for has been misplaced by the CVar Section Guards.</div>
        <a href="index.html" class="home-btn">Return to Documentation</a>
    </div>

    <script src="js/formatter.js?v=1.6.0"></script>
    <script src="js/theme.js?v=1.6.0"></script>
    <script src="js/ai-knowledge.js?v=1.6.0"></script>
    <script src="js/ai-chat.js?v=1.6.0"></script>
    <script src="js/main.js?v=1.6.0"></script>
</body>
</html>
