<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found — WuWa Config Patcher</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: calc(100vh - 70px);
            text-align: center;
            padding: 20px;
        }
        .error-code {
            font-size: 120px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 20px;
        }
        .error-msg {
            font-size: 20px;
            color: var(--text-muted);
            margin-bottom: 30px;
        }
        .home-btn {
            background-color: var(--bg-surface);
            border: 1px solid var(--accent-purple);
            color: var(--accent-purple);
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.2s ease;
        }
        .home-btn:hover {
            background-color: rgba(168, 85, 247, 0.15);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="header-brand">
            <div class="logo-icon">⚡</div>
            <div>
                <h1>WuWa Config Patcher</h1>
            </div>
        </div>
    </header>

    <div class="error-container">
        <div class="error-code">404</div>
        <div class="error-msg">The configuration file you are looking for has been misplaced by the Section Guards.</div>
        <a href="/" class="home-btn">Return to Documentation</a>
    </div>
</body>
</html>
